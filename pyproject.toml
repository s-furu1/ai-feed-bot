[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-feed-bot"
version = "0.1.0"
description = "AI RSS feed summarizer and Slack draft workflow"
requires-python = ">=3.11"
dependencies = [
  "slack-bolt>=1.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

